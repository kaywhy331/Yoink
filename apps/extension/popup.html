<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoink Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="app-header">
      <div class="brand" aria-label="Yoink">
        <img src="yoink-icon.svg" alt="" width="34" height="34">
        <strong>Yoink</strong>
      </div>
      <div class="header-actions">
        <button class="status-button" id="statusButton" type="button" aria-expanded="false" aria-controls="statusPanel">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span id="statusLabel">Checking</span>
        </button>
        <button class="icon-button" id="menuButton" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="overflowPanel">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
      </div>
    </header>

    <section class="popover status-panel" id="statusPanel" aria-label="System status" hidden>
      <dl id="statusDetails"></dl>
      <button class="panel-link" id="statusConnections" type="button">Settings › Chrome <span aria-hidden="true">›</span></button>
    </section>

    <section class="popover overflow-panel" id="overflowPanel" role="menu" aria-label="More options" hidden>
      <button id="syncProducts" type="button" role="menuitem">Sync products</button>
      <button id="shareEvidence" type="button" role="menuitem" hidden>Share evidence</button>
      <button id="saveRepairPage" type="button" role="menuitem" hidden>Save this page for a store repair</button>
      <button id="checkUpdate" type="button" role="menuitem" hidden>Check for updates</button>
      <button id="cartReadySound" type="button" role="menuitemcheckbox" aria-checked="false"><span>Action handoff sound</span><span class="menu-check" aria-hidden="true">Off</span></button>
      <span class="menu-separator" role="separator"></span>
      <button id="extensionSettings" type="button" role="menuitem">Extension settings</button>
    </section>

    <section class="context-surface" id="contextSurface" aria-live="polite" hidden>
      <p class="eyebrow" id="contextEyebrow"></p>
      <h1 id="contextTitle"></h1>
      <p class="supporting" id="contextSupporting" hidden></p>
      <p class="result-status" id="contextResultStatus" role="status" aria-live="polite" hidden></p>
      <div class="pair-fields" id="pairFields" hidden>
        <label class="sr-only" for="pairCode">One-time pairing code</label>
        <input id="pairCode" inputmode="text" autocomplete="off" maxlength="20" placeholder="XXXX-XXXX-XXXX">
      </div>
      <button class="button primary popup-cta" id="primaryAction" type="button" hidden></button>
      <section class="cart-outcome" id="cartOutcome" aria-labelledby="cartOutcomePrompt" hidden>
        <p id="cartOutcomePrompt">Did you check out?</p>
        <div class="cart-outcome-choices" id="cartOutcomeChoices">
          <button class="button secondary popup-choice" type="button" id="cartOutcomeGotIt">Got it</button>
          <button class="button secondary popup-choice" type="button" id="cartOutcomeMissedIt">Missed it</button>
        </div>
        <form id="cartOutcomeForm" hidden>
          <label for="cartOutcomeAmount">Amount charged</label>
          <div class="money-field">
            <span aria-hidden="true">$</span>
            <input id="cartOutcomeAmount" name="amount" inputmode="decimal" autocomplete="off" required>
          </div>
          <p class="field-hint" id="cartOutcomeLimit"></p>
          <div class="cart-outcome-form-actions">
            <button class="button primary popup-cta" id="cartOutcomeConfirm" type="submit">Record purchase</button>
            <button class="text-action" id="cartOutcomeBack" type="button">Back</button>
          </div>
        </form>
        <p class="field-error" id="cartOutcomeError" role="alert" hidden></p>
      </section>
      <button class="text-action" id="cancelContext" type="button" hidden>Cancel</button>
      <button class="details-button" id="resultDetailsButton" type="button" aria-expanded="false" aria-controls="resultDetails" hidden>View details</button>
      <p class="result-details" id="resultDetails" hidden></p>
    </section>

    <button class="activity-row" id="activityAction" type="button" hidden>
      <span id="activityActionLabel"></span><span aria-hidden="true">›</span>
    </button>
    <p class="activity-row activity-status" id="activityStatus" hidden></p>

    <footer>
      <p class="footer-boundary">Checkout stays manual.</p>
      <button id="openYoink" class="footer-link" type="button">Open Yoink <span aria-hidden="true">›</span></button>
    </footer>

    <output class="toast" id="toast" role="status" aria-live="polite" hidden></output>
    <p class="sr-only" id="assertiveStatus" role="alert" aria-live="assertive"></p>
  </main>
  <script src="runtime-config.js"></script>
  <script src="popup-state.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
