<!doctype html>
<!-- Modeled Best Buy cart (no live cart capture exists yet) whose line uses a
     +/- quantity stepper that shows the quantity as plain text. -->
<html lang="en"><body><main>
  <h1>Your Cart</h1>
  <div data-testid="cart-item">
    <a href="/product/ultra-pro-3-x-4-clear-regular-toploader-25-count-pack/J79X4PXVR7/sku/6528565">Ultra PRO - 3" x 4" Clear Regular Toploader 25-Count Pack</a>
    <div data-testid="sold-by">Sold by Best Buy</div>
    <div data-testid="quantity-stepper">
      <button type="button" aria-label="Decrease quantity">&minus;</button>
      <span data-testid="quantity-value">2</span>
      <button type="button" aria-label="Increase quantity">+</button>
    </div>
    <div data-testid="line-price">$10.98</div>
    <button type="button">Remove</button>
  </div>
</main></body></html>
