<!doctype html><body><main>
  <div id="desktop_buybox" data-feature-name="desktop_buybox">
    <div id="buybox">
      <form id="addToCart" action="/gp/product/handle-buy-box">
        <input name="items[0.base][asin]" type="hidden" value="B081J5PW5J">
        <input name="items[0.base][offerListingId]" type="hidden" value="FIXTURE_ODF_SEPARATED_MARKETPLACE_OFFER">
        <input name="offerListingID" type="hidden" value="FIXTURE_ODF_SEPARATED_MARKETPLACE_OFFER">
        <div id="corePrice_feature_div"><span class="a-offscreen">$11.99</span></div>
        <div id="deliveryBlock_feature_div" data-feature-name="deliveryBlock">Delivery tomorrow</div>
        <div id="addToCart_feature_div" data-feature-name="addToCart">
          <input id="add-to-cart-button" name="submit.add-to-cart" type="submit" value="Add to cart">
        </div>
        <div id="fulfillerInfoFeature_feature_div" data-feature-name="fulfillerInfoFeature">
          <div class="offer-display-feature-label" offer-display-feature-name="desktop-fulfiller-info">
            <span>Ships from</span>
          </div>
          <div class="offer-display-feature-text" offer-display-feature-name="desktop-fulfiller-info">
            <span class="offer-display-feature-text-message">Amazon</span>
          </div>
        </div>
        <div id="merchantInfoFeature_feature_div" data-feature-name="merchantInfoFeature">
          <div class="offer-display-feature-label" offer-display-feature-name="desktop-merchant-info">
            <span>Sold by</span>
          </div>
          <div class="offer-display-feature-text" offer-display-feature-name="desktop-merchant-info">
            <a id="sellerProfileTriggerId" class="offer-display-feature-text-message">theory11</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</main></body>
