<!-- Target product page, late-September 2026 layout (structure from a real page, text reduced):
     the buy button lives in its own ProductDetailAddToCart module beside the Fulfillment region.
     Pickup at a store without stock is selected, so the button reads "Show in-stock stores". -->
<html><body>
<div data-test="sticky-atc" aria-hidden="true"><div data-test="StickyAddToCartFulfillmentSection"><div class="h-display-flex">
  <button type="button" id="addToCartButtonOrTextIdFor1011411628" data-test="showInStockPrimaryButton" aria-label="Show in-stock stores for Pokemon Deluxe Character Guide">Show in-stock stores</button>
</div></div></div>
<main id="pageBodyContainer"><div id="above-the-fold-information">
  <div data-module-type="ProductDetailPrice"><div data-test="module-product-detail-price-v2"><span data-test="product-price">$41.98</span></div></div>
  <div data-test="sold-by">Sold and shipped by Target</div>
  <div data-module-type="ProductDetailFulfillment"><div data-test="module-product-detail-fulfillment-v1" aria-label="Fulfillment" role="region">
    <button type="button" id="PICKUP" aria-label="Pickup Get it nearby today, selected">Pickup Get it nearby today</button>
    <button type="button" id="DELIVERY" aria-label="Delivery Not available, ">Delivery Not available</button>
    <button type="button" id="SHIPPING" aria-label="Shipping Arrives by Fri, Oct 2, ">Shipping Arrives by Fri, Oct 2</button>
    <div>Out of stock at San Dimas</div><div>Available near you</div>
  </div></div>
  <div data-module-type="ProductDetailAddToCart"><div data-test="module-product-detail-add-to-cart">
    <button type="button" id="AddToCart.Fiats" data-test="AddToCart.Fiats" aria-label="Show in-stock stores for Pokemon Deluxe Character Guide">Show in-stock stores</button>
    <div data-test="notifyMeWrapper"><button type="button" data-test="notifyMe">Notify me when available</button></div>
  </div></div>
  <div data-module-type="ProductDetailAddToList"><button type="button" id="Add 1011411628 to List" data-test="Add to list" aria-label="Add to List">Add to list</button></div>
</div></main>
</body></html>
