<!-- Target shipping-only product, late-September 2026 layout (structure from a real page, text reduced):
     the Fulfillment region has no method tiles, only "Ship to <zip> · Arrives by <date>". -->
<html><body>
<div data-test="sticky-atc" aria-hidden="true"><div data-test="StickyAddToCartFulfillmentSection"><div class="h-display-flex">
  <button type="button" id="addToCartButtonOrTextIdFor95290386" data-test="quantity-stepper">Add to cart</button>
</div></div></div>
<main id="pageBodyContainer"><div id="above-the-fold-information">
  <div data-module-type="ProductDetailPrice"><div data-test="module-product-detail-price-v2"><span data-test="product-price">$17.99</span></div></div>
  <div data-test="sold-by">Sold and shipped by Target</div>
  <div data-module-type="ProductDetailFulfillment"><div aria-label="Fulfillment" role="region">
    <div><div data-test="text-quill"><span>Ship to 91724</span></div>
    <div data-test="text-quill"><span>Arrives by Fri, Oct 16</span></div>
    <div data-test="text-quill"><span>Ships free with </span><span> or $35 orders - </span><span><button type="button" role="button">exclusions apply</button></span></div></div>
    <button type="button" data-test="@web/EditLocationLink">Change</button>
  </div></div>
  <div data-module-type="ProductDetailAddToCart"><div data-test="module-product-detail-add-to-cart">
    <div><div><button type="button" id="addToCartButtonOrTextIdFor95290386" data-test="quantity-stepper">Add to cart</button></div></div>
    <button type="button" aria-disabled="false" aria-label="Sign in to buy now for Yu-Gi-Oh! Battle of Legends Glorious Gallery Box" data-test="sign-in-to-buy-now-button" id="sign-in-to-buy-now-button">Sign in to buy now</button>
  </div></div>
</div></main>
</body></html>
