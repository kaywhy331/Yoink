<!-- Target shipping-only product, October 2026 layout (structure from field capsule
     cap_a2e79b4a65d94677bbd3f3d4881d1e7a, 2026-10-09, text reduced): the client-rendered
     ProductDetailPrice_2 module is still its animated loading skeleton, and the exact item's
     price is only in the aria-hidden sticky add-to-cart bar. Signed out ("Sign in to buy now"). -->
<html><body>
<header><a aria-expanded="false" aria-label="Account, sign in" data-test="@web/AccountLink" id="account-sign-in" href="/account?prehydrateClick=true">Sign in</a></header>
<main id="pageBodyContainer"><div id="above-the-fold-information">
  <div data-module-type="ProductDetailPrice"><div class="h-margin-a-module-gap" data-test="module-product-detail-price-v2">
    <div class="styles_productDetailPriceFlexContainer"><div class="styles_ndsPlaceholder styles_animated" data-test="price-module-placeholder"></div></div>
  </div></div>
  <div data-module-type="ProductDetailVariationSelector"></div>
  <div data-module-type="ProductDetailFulfillment"><div aria-label="Fulfillment" role="region">
    <div><div data-test="text-quill"><span data-test="text-quill-insert-0">Ship to 52404</span></div>
    <div data-test="text-quill"><span data-test="text-quill-insert-0">Arrives by Thu, Oct 22</span></div>
    <div data-test="text-quill"><span data-test="text-quill-insert-0">Ships free with </span><span data-test="text-quill-insert-2"> or $35 orders - </span><span data-test="text-quill-insert-3"><button type="button" role="button">exclusions apply</button></span></div></div>
    <button type="button" data-test="@web/EditLocationLink">Change</button>
  </div></div>
  <div data-module-type="ProductDetailAddToCart"><div data-test="module-product-detail-add-to-cart">
    <div><div><div><button type="button" id="addToCartButtonOrTextIdFor95290386" data-test="quantity-stepper">Add to cart</button></div></div>
    <button type="button" aria-disabled="false" aria-label="Sign in to buy now for Yu-Gi-Oh! Trading Card Game: Battle of Legends Glorious Gallery Box" data-test="sign-in-to-buy-now-button" id="sign-in-to-buy-now-button">Sign in to buy now</button></div>
  </div></div>
</div></main>
<div data-enabled="false" data-test="sticky-atc" aria-hidden="true"><div><div>
  <h3 aria-label="Yu-Gi-Oh! Trading Card Game: Battle of Legends Glorious Gallery Box"><div data-test="product-title" itemprop="name">Yu-Gi-Oh! Trading Card Game: Battle of Legends Glorious Gallery Box</div></h3>
</div><div>
  <div data-test="@web/Price/PriceFull"><div><span><span data-test="product-price">$17.99</span></span></div></div>
  <div data-test="StickyAddToCartFulfillmentSection"><div class="h-display-flex">
    <button type="button" id="addToCartButtonOrTextIdFor95290386" data-test="quantity-stepper">Add to cart</button>
  </div></div>
</div></div></div>
</body></html>
