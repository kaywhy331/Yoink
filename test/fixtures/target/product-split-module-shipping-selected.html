<!-- The same Target page after choosing Shipping: the module's button becomes the exact-TCIN
     "Add to cart" control, which Target also marks data-test="quantity-stepper". -->
<html><body>
<div data-test="sticky-atc" aria-hidden="true"><div data-test="StickyAddToCartFulfillmentSection"><div class="h-display-flex">
  <button type="button" id="addToCartButtonOrTextIdFor1011411628" data-test="quantity-stepper">Add to cart</button>
</div></div></div>
<main id="pageBodyContainer"><div id="above-the-fold-information">
  <div data-module-type="ProductDetailPrice"><div data-test="module-product-detail-price-v2"><span data-test="product-price">$41.98</span></div></div>
  <div data-test="sold-by">Sold and shipped by Target</div>
  <div data-module-type="ProductDetailFulfillment"><div data-test="module-product-detail-fulfillment-v1" aria-label="Fulfillment" role="region">
    <button type="button" id="PICKUP" aria-label="Pickup Get it nearby today, ">Pickup Get it nearby today</button>
    <button type="button" id="DELIVERY" aria-label="Delivery Not available, ">Delivery Not available</button>
    <button type="button" id="SHIPPING" aria-label="Shipping Arrives by Fri, Oct 2, selected">Shipping Arrives by Fri, Oct 2</button>
  </div></div>
  <div data-module-type="ProductDetailAddToCart"><div data-test="module-product-detail-add-to-cart">
    <div><div><button type="button" id="addToCartButtonOrTextIdFor1011411628" data-test="quantity-stepper">Add to cart</button></div></div>
    <button type="button" aria-disabled="false" aria-label="Sign in to buy now for Pokemon Deluxe Character Guide" data-test="sign-in-to-buy-now-button" id="sign-in-to-buy-now-button">Sign in to buy now</button>
  </div></div>
</div></main>
</body></html>
