<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1040" viewBox="0 0 1180 1040" role="img" aria-labelledby="title description">
  <title id="title">Yoink extension popup rendered states</title>
  <desc id="description">Six rendered popup states: healthy idle, Target product, TrackaLacker attention, Walmart Draw, paused product, and companion unavailable.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071011" flood-opacity=".25"/>
    </filter>
    <style>
      .canvas { fill: #e8eeec; }
      .state-name { fill: #30413d; font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .frame { fill: #0d1517; }
      .surface { fill: #142124; }
      .line { stroke: #223538; stroke-width: 1; }
      .brand { fill: #eef7f4; font: 700 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .status { fill: #91aaa4; font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #91aaa4; font: 800 10px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }
      .title { fill: #eef7f4; font: 700 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .support { fill: #91aaa4; font: 400 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .button { fill: #28c499; }
      .button-text { fill: #06120f; font: 800 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .activity { fill: #91aaa4; font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .footer { fill: #91aaa4; font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: end; }
      .kebab { fill: #91aaa4; }
    </style>
  </defs>
  <rect class="canvas" width="1180" height="1040"/>

  <!-- Healthy idle -->
  <text class="state-name" x="20" y="35">Healthy idle</text>
  <g transform="translate(20 50)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="257" cy="34" r="4" fill="#28c499"/>
    <text class="status" x="267" y="38">Ready</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <text class="activity" x="18" y="274">Signals live · 561 followed</text>
    <line class="line" x1="18" y1="292" x2="342" y2="292"/>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>

  <!-- Product -->
  <text class="state-name" x="410" y="35">Supported product</text>
  <g transform="translate(410 50)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="257" cy="34" r="4" fill="#28c499"/><text class="status" x="267" y="38">Ready</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <rect class="surface" x="16" y="80" width="328" height="170" rx="14"/>
    <text class="eyebrow" x="34" y="108">TARGET</text>
    <text class="title" x="34" y="137">Target product · TCIN 94972381</text>
    <rect class="button" x="34" y="181" width="292" height="44" rx="10"/>
    <text class="button-text" x="180" y="208">Inspect product</text>
    <text class="activity" x="18" y="291">Signals live</text>
    <line class="line" x1="18" y1="309" x2="342" y2="309"/>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>

  <!-- Disconnected secondary attention -->
  <text class="state-name" x="800" y="35">TrackaLacker attention</text>
  <g transform="translate(800 50)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="219" cy="34" r="4" fill="#e57361"/><text class="status" x="229" y="38">Needs attention</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <rect class="surface" x="16" y="80" width="328" height="170" rx="14"/>
    <text class="eyebrow" x="34" y="108">BEST BUY</text>
    <text class="title" x="34" y="137">Best Buy product · SKU 6685081</text>
    <rect class="button" x="34" y="181" width="292" height="44" rx="10"/>
    <text class="button-text" x="180" y="208">Inspect product</text>
    <text class="activity" x="18" y="291">TrackaLacker disconnected · Reconnect  ›</text>
    <line class="line" x1="18" y1="309" x2="342" y2="309"/>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>

  <!-- Walmart Draw -->
  <text class="state-name" x="20" y="525">Walmart Draw</text>
  <g transform="translate(20 540)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="257" cy="34" r="4" fill="#28c499"/><text class="status" x="267" y="38">Ready</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <rect class="surface" x="16" y="80" width="328" height="178" rx="14"/>
    <text class="eyebrow" x="34" y="108">WALMART</text>
    <text class="title" x="34" y="137">Collectibles Draw</text>
    <text class="support" x="34" y="160">Entry stays manual</text>
    <rect class="button" x="34" y="189" width="292" height="44" rx="10"/>
    <text class="button-text" x="180" y="216">Inspect drawings</text>
    <text class="activity" x="18" y="299">Signals live</text>
    <line class="line" x1="18" y1="317" x2="342" y2="317"/>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>

  <!-- Paused product -->
  <text class="state-name" x="410" y="525">Paused product</text>
  <g transform="translate(410 540)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="252" cy="34" r="4" fill="#d7a450"/><text class="status" x="262" y="38">Paused</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <rect class="surface" x="16" y="80" width="328" height="170" rx="14"/>
    <text class="eyebrow" x="34" y="108">AMAZON</text>
    <text class="title" x="34" y="137">Amazon product · ASIN B00E4AMFKK</text>
    <rect class="button" x="34" y="181" width="292" height="44" rx="10"/>
    <text class="button-text" x="180" y="208">Inspect product</text>
    <text class="activity" x="18" y="291">Retailer actions paused · Review  ›</text>
    <line class="line" x1="18" y1="309" x2="342" y2="309"/>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>

  <!-- Hard blocker -->
  <text class="state-name" x="800" y="525">Hard blocker</text>
  <g transform="translate(800 540)" filter="url(#shadow)">
    <rect class="frame" width="360" height="400" rx="14"/>
    <rect x="16" y="16" width="34" height="34" rx="9" fill="#12372f"/>
    <path d="M23 24h7l3 7 4-7h7l-8 13v7h-7v-7z" fill="#f6c453"/>
    <text class="brand" x="59" y="39">Yoink</text>
    <circle cx="219" cy="34" r="4" fill="#e57361"/><text class="status" x="229" y="38">Needs attention</text>
    <circle class="kebab" cx="336" cy="27" r="1.6"/><circle class="kebab" cx="336" cy="34" r="1.6"/><circle class="kebab" cx="336" cy="41" r="1.6"/>
    <rect class="surface" x="16" y="80" width="328" height="185" rx="14"/>
    <text class="eyebrow" x="34" y="108">YOINK</text>
    <text class="title" x="34" y="137">Yoink unavailable</text>
    <text class="support" x="34" y="160">Start Yoink, then retry.</text>
    <rect class="button" x="34" y="196" width="292" height="44" rx="10"/>
    <text class="button-text" x="180" y="223">Retry</text>
    <text class="footer" x="342" y="370">Open Yoink  →</text>
  </g>
</svg>
